version: "3.9"

services:
  camera-viewer:
    build: ./app
    container_name: camera-viewer
    restart: unless-stopped
    environment:
      - PORT=3040
      - HLS_PATH=/tmp/hls
      - AUTH_USER=lola
      - AUTH_PASS=NVS_P@ssw0rd
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL}
    volumes:
      - hls:/tmp/hls
    ports:
      - "3040:3040"
    networks:
      - cloudflare-network

volumes:
  hls:

networks:
  cloudflare-network:
    external: true
